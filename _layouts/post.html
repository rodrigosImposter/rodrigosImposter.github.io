---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="post-lede">{{ page.description }}</p>{% endif %}
    <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y 年 %-m 月 %-d 日" }}</time>{% if page.last_modified_at %}，更新于 <time datetime="{{ page.last_modified_at | date_to_xmlschema }}">{{ page.last_modified_at | date: "%Y 年 %-m 月 %-d 日" }}</time>{% endif %}</p>
  </header>
  <div class="post-body">
    {{ content }}
  </div>
</article>
