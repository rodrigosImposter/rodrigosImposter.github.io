<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <script>
    (function () {
      var d = document.documentElement, saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      if (saved === "light" || saved === "dark") d.setAttribute("data-theme", saved);
      var mq = window.matchMedia("(prefers-color-scheme: dark)");
      function effective() {
        var t = d.getAttribute("data-theme") || (mq.matches ? "dark" : "light");
        d.setAttribute("data-theme-effective", t);
        document.dispatchEvent(new Event("themechange"));
        return t;
      }
      effective();
      if (mq.addEventListener) mq.addEventListener("change", effective);
      window.setSiteTheme = function (t) {
        d.setAttribute("data-theme", t);
        try { localStorage.setItem("theme", t); } catch (e) {}
        return effective();
      };
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700&family=Noto+Serif+SC:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  {% feed_meta %}
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav aria-label="主导航">
      <a href="{{ '/' | relative_url }}">文章</a>
      <a href="{{ '/about/' | relative_url }}">关于</a>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="切换深色模式" hidden>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
      </button>
    </nav>
  </header>
  <main id="main">
    {{ content }}
  </main>
  <footer class="site-footer">
    <p>{{ site.description }}</p>
    <p><a href="{{ '/feed.xml' | relative_url }}">订阅 RSS</a></p>
  </footer>
  <script>
    (function () {
      var b = document.getElementById("theme-toggle");
      if (!b || !window.setSiteTheme) return;
      function current() { return document.documentElement.getAttribute("data-theme-effective"); }
      function label() {
        var t = current() === "dark" ? "切换到浅色模式" : "切换到深色模式";
        b.setAttribute("aria-label", t);
        b.title = t;
      }
      b.hidden = false;
      label();
      b.addEventListener("click", function () {
        window.setSiteTheme(current() === "dark" ? "light" : "dark");
      });
      document.addEventListener("themechange", label);
    })();
  </script>
</body>
</html>
